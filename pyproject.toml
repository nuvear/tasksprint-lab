[project]
name = "tasksprint-lab"
version = "0.2.0"
description = "TaskSprint lab backend (Phase 02: persistent state, roles, starter to-do app)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The cache provider is disabled because the owner's mounted folder does not
# permit file deletion; pytest's cache writes would leave stale temp files.
addopts = "-p no:cacheprovider"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: starts real local processes (not part of the Phase 02 unit/security gate)",
]
